  # kafdrop:
  #   image: obsidiandynamics/kafdrop:latest
  #   container_name: kafdrop
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "9000:9000"
  #   environment:
  #     KAFKA_BROKERCONNECT: "kafka:9092"

  # minio:
  #   image: minio/minio:latest
  #   container_name: minio
  #   ports:
  #     - "9001:9001"  # Console UI
  #     - "9002:9000"  # S3 API
  #   environment:
  #     MINIO_ROOT_USER: admin
  #     MINIO_ROOT_PASSWORD: password123
  #   command: server /data --console-address ":9001"

  stock-producer:
    build:
      context: .. # build from repo root
      dockerfile: orchestration/Dockerfile
    container_name: stock-producer
    restart: always
    env_file: ../.env
    volumes:
      # - .:/app # Syncs your code so you can make changes without rebuilding (Bind-Mounting)
      - ../gcp-key.json:/app/gcp-key.json # Mounts your GCP key for BigQuery access

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: on-failure
    entrypoint: []
    command:
      - bash
      - -c
      - 'airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin'

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: always
    depends_on:
      - airflow-init
      - airflow-scheduler
      - postgres
    ports:
      - '8080:8080'
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-init
      - postgres
    command: scheduler

  # For Airflow, we need a separate service for the scheduler and the webserver, both connecting to the same Postgres database. The scheduler will run in the background and execute tasks, while the webserver will provide the UI for monitoring and managing workflows.
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  postgres_data:
